<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Group WebRTC Chat</title>
    <style>
        video {
            width: 200px;
            height: 150px;
            border: 1px solid black;
            margin: 5px;
        }
        #videos {
            display: flex;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <h1>Group WebRTC Chat</h1>
    <div id="videos">
        <video id="localVideo" autoplay muted></video>
    </div>
    <p>Your Room Link: <span id="shareLink"></span></p>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        const localVideo = document.getElementById('localVideo');
        const videosDiv = document.getElementById('videos');
        const shareLinkSpan = document.getElementById('shareLink');

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || Math.random().toString(36).substring(2, 8); // Random room if none provided
        const peersToCall = [];

        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localVideo.srcObject = stream;

                const peer = new Peer({
                    host: '0.peerjs.com',
                    port: 443,
                    secure: true,
                    config: {
                        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                    }
                });

                peer.on('open', id => {
                    const shareUrl = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
                    shareLinkSpan.textContent = shareUrl;

                    // Simulate a room by calling peers already in it
                    if (urlParams.get('room')) {
                        fetchRoomPeers(roomId, id);
                    }
                });

                peer.on('call', call => {
                    call.answer(stream);
                    call.on('stream', remoteStream => {
                        addVideoStream(remoteStream, call.peer);
                    });
                });

                function fetchRoomPeers(room, myId) {
                    // In a real app, you'd use a server or PeerJS "listAllPeers".
                    // Here, we simulate by prompting to connect manually or assuming peers join via link.
                    setTimeout(() => {
                        peersToCall.forEach(peerId => {
                            if (peerId !== myId) {
                                const call = peer.call(peerId, stream);
                                call.on('stream', remoteStream => {
                                    addVideoStream(remoteStream, peerId);
                                });
                            }
                        });
                    }, 1000); // Delay to let others join
                }

                function addVideoStream(stream, peerId) {
                    if (!document.getElementById(`video-${peerId}`)) {
                        const video = document.createElement('video');
                        video.id = `video-${peerId}`;
                        video.srcObject = stream;
                        video.autoplay = true;
                        videosDiv.appendChild(video);
                    }
                }

                // Hack: Manually add peers to call (for demo purposes)
                if (!urlParams.get('room')) {
                    peersToCall.push(peer.id); // Store initial peer
                }
            })
            .catch(error => {
                console.error('Error accessing media devices.', error);
                alert('Please allow camera and microphone access.');
            });
    </script>
</body>
</html>
