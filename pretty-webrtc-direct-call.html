<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectNow | Video Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5865F2;
            --primary-dark: #4752c4;
            --secondary: #9BA3EB;
            --dark: #2E3267;
            --light: #f5f5f5;
            --danger: #ED4245;
            --success: #57F287;
            --warning: #FEE75C;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --transition: all 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 20px;
            color: white;
            text-align: center;
            box-shadow: var(--shadow);
        }
        
        .header h1 {
            font-weight: 600;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }
        
        .status-bar {
            background-color: white;
            border-radius: var(--radius);
            padding: 15px 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--success);
            display: inline-block;
        }
        
        .video-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .video-wrapper {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            background-color: var(--dark);
            aspect-ratio: 16/9;
        }
        
        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
        }
        
        .video-label {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            box-shadow: var(--shadow);
            color: var(--dark);
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        }
        
        .control-btn.end-call {
            background-color: var(--danger);
            color: white;
        }
        
        .share-box {
            background-color: white;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-top: 20px;
        }
        
        .share-box h3 {
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 600;
            color: var(--dark);
        }
        
        .copy-link {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .link-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 14px;
            color: var(--dark);
            background-color: #f9f9f9;
        }
        
        .copy-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 12px 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .copy-btn:hover {
            background-color: var(--primary-dark);
        }
        
        .id-badge {
            background-color: var(--secondary);
            color: white;
            display: inline-block;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 14px;
            margin: 5px 0;
            font-family: monospace;
            letter-spacing: 1px;
        }
        
        .waiting-message {
            text-align: center;
            padding: 30px;
            color: #777;
            font-style: italic;
        }
        
        @media (max-width: 768px) {
            .video-container {
                grid-template-columns: 1fr;
            }
            
            .copy-link {
                flex-direction: column;
            }
            
            .status-bar {
                padding: 12px;
            }
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
        }

        .loading:after {
            content: " ";
            display: block;
            width: 40px;
            height: 40px;
            margin: 8px;
            border-radius: 50%;
            border: 6px solid #fff;
            border-color: #fff transparent #fff transparent;
            animation: loading 1.2s linear infinite;
        }

        @keyframes loading {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-video"></i> ConnectNow</h1>
    </div>
    
    <div class="container">
        <div class="status-bar">
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text">Online</span>
            </div>
            <div>
                <p>Your ID: <span class="id-badge" id="peerId">Connecting...</span></p>
            </div>
        </div>
        
        <div class="video-container">
            <div class="video-wrapper">
                <div class="loading" id="localLoading"></div>
                <video id="localVideo" autoplay muted class="hidden"></video>
                <div class="video-label">
                    <i class="fas fa-user"></i> You
                </div>
            </div>
            
            <div class="video-wrapper">
                <div id="waitingMessage" class="waiting-message">
                    Waiting for someone to join...
                </div>
                <div class="loading hidden" id="remoteLoading"></div>
                <video id="remoteVideo" autoplay class="hidden"></video>
                <div class="video-label hidden" id="remoteLabel">
                    <i class="fas fa-user-friends"></i> Friend
                </div>
            </div>
        </div>
        
        <div class="controls">
            <div class="control-btn" id="toggleAudio">
                <i class="fas fa-microphone"></i>
            </div>
            <div class="control-btn" id="toggleVideo">
                <i class="fas fa-video"></i>
            </div>
            <div class="control-btn end-call" id="endCall">
                <i class="fas fa-phone-slash"></i>
            </div>
        </div>
        
        <div class="share-box">
            <h3>Invite a friend</h3>
            <p>Share this link with a friend to start a video call:</p>
            <div class="copy-link">
                <input type="text" class="link-input" id="shareLink" readonly>
                <button class="copy-btn" id="copyBtn">
                    <i class="fas fa-copy"></i> Copy
                </button>
            </div>
        </div>
    </div>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const peerIdSpan = document.getElementById('peerId');
        const shareLinkInput = document.getElementById('shareLink');
        const copyBtn = document.getElementById('copyBtn');
        const toggleAudio = document.getElementById('toggleAudio');
        const toggleVideo = document.getElementById('toggleVideo');
        const endCall = document.getElementById('endCall');
        const waitingMessage = document.getElementById('waitingMessage');
        const remoteLabel = document.getElementById('remoteLabel');
        const localLoading = document.getElementById('localLoading');
        const remoteLoading = document.getElementById('remoteLoading');

        const urlParams = new URLSearchParams(window.location.search);
        const connectTo = urlParams.get('connectTo');
        
        let localStream;
        let isAudioMuted = false;
        let isVideoOff = false;

        // Initialize
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
                
                // Show video once it's loaded
                localVideo.onloadedmetadata = () => {
                    localLoading.classList.add('hidden');
                    localVideo.classList.remove('hidden');
                    localVideo.classList.add('fade-in');
                };

                const peer = new Peer({
                    host: '0.peerjs.com',
                    port: 443,
                    secure: true,
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' }
                        ]
                    }
                });

                peer.on('open', id => {
                    peerIdSpan.textContent = id;
                    const shareUrl = `${window.location.origin}${window.location.pathname}?connectTo=${id}`;
                    shareLinkInput.value = shareUrl;

                    if (connectTo && connectTo !== id) {
                        waitingMessage.textContent = "Connecting to peer...";
                        waitingMessage.classList.add('hidden');
                        remoteLoading.classList.remove('hidden');
                        
                        const call = peer.call(connectTo, stream);
                        handleCall(call);
                    }
                });

                peer.on('call', call => {
                    waitingMessage.classList.add('hidden');
                    remoteLoading.classList.remove('hidden');
                    
                    call.answer(stream);
                    handleCall(call);
                });
                
                function handleCall(call) {
                    call.on('stream', remoteStream => {
                        remoteVideo.srcObject = remoteStream;
                        
                        remoteVideo.onloadedmetadata = () => {
                            remoteLoading.classList.add('hidden');
                            remoteVideo.classList.remove('hidden');
                            remoteLabel.classList.remove('hidden');
                            remoteVideo.classList.add('fade-in');
                        };
                    });
                }

                // Controls
                toggleAudio.addEventListener('click', () => {
                    isAudioMuted = !isAudioMuted;
                    localStream.getAudioTracks().forEach(track => {
                        track.enabled = !isAudioMuted;
                    });
                    toggleAudio.innerHTML = isAudioMuted ? 
                        '<i class="fas fa-microphone-slash"></i>' : 
                        '<i class="fas fa-microphone"></i>';
                });

                toggleVideo.addEventListener('click', () => {
                    isVideoOff = !isVideoOff;
                    localStream.getVideoTracks().forEach(track => {
                        track.enabled = !isVideoOff;
                    });
                    toggleVideo.innerHTML = isVideoOff ? 
                        '<i class="fas fa-video-slash"></i>' : 
                        '<i class="fas fa-video"></i>';
                });

                endCall.addEventListener('click', () => {
                    if (confirm("End the call?")) {
                        window.location.href = window.location.pathname;
                    }
                });
                
                // Copy button
                copyBtn.addEventListener('click', () => {
                    shareLinkInput.select();
                    document.execCommand('copy');
                    copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                    setTimeout(() => {
                        copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
                    }, 2000);
                });
            })
            .catch(error => {
                console.error('Error accessing media devices.', error);
                alert('Please allow camera and microphone access to use the chat.');
            });
    </script>
</body>
</html>
